services:
  postgres:
    image: postgres:17.11
    container_name: database-postgres
    environment:
      POSTGRES_DB: chicken-farm
      POSTGRES_USER: chicken-farm
      POSTGRES_PASSWORD: chicken-farm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  postgres_data:
